<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Avalon — UHS Chemistry Club</title>
  <meta name="description" content="Avalon — UHS Chemistry Club competition portal.">
  <meta name="theme-color" content="#0a0908">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <!-- Installed to a Home Screen, Avalon launches with no address bar. That is
       the only route to a full screen on iPhone Safari, which has no
       Fullscreen API; see src/game-mode.js. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Avalon">
  <link href="https://fonts.googleapis.com/css2?family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/main.css">
  <link rel="stylesheet" href="/src/styles/holo.css">
  <link rel="stylesheet" href="/src/styles/learn.css">
  <link rel="stylesheet" href="/src/styles/progression.css">
  <link rel="stylesheet" href="/src/styles/voyage.css">
  <link rel="stylesheet" href="/src/styles/mobile.css">
  <link rel="stylesheet" href="/src/styles/mobile-screens.css">
  <link rel="stylesheet" href="/src/styles/mobile-quest.css">
  <link rel="stylesheet" href="/src/styles/mobile-landscape.css">
  <link rel="stylesheet" href="/src/styles/mobile-game.css">
  <link rel="stylesheet" href="/src/styles/pwa-install.css">
</head>
<body class="theme-dark">
  <!-- 3D Persistent Canvas -->
  <canvas id="webgl-canvas" aria-hidden="true"></canvas>

  <!-- Fallback static backdrop for T1 non-webgl tier -->
  <div id="fallback-backdrop" class="fallback-backdrop hidden" aria-hidden="true"></div>

  <!-- Global HUD / Header -->
  <header id="hud" class="hud">
    <div class="hud-left">
      <button id="mobile-menu-btn" class="mobile-menu-btn" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="mobile-sidebar">
        <svg class="mobile-menu-hamburger" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="hud-logo-icon mobile-menu-logo" aria-hidden="true" width="16" height="18" viewBox="0 0 15 17" fill="none">
          <path d="M7.5 1 14 4.75v7.5L7.5 16 1 12.25v-7.5L7.5 1Z" stroke="currentColor" stroke-width="1.2"/>
          <path d="M7.5 5.5 11 7.5v4l-3.5 2L4 11.5v-4l3.5-2Z" fill="currentColor" opacity=".55"/>
        </svg>
        <span class="mobile-menu-title">AVALON</span>
      </button>

      <a href="#/" class="hud-brand" aria-label="Avalon home">
        <svg class="hud-logo-icon" aria-hidden="true" width="15" height="17" viewBox="0 0 15 17" fill="none">
          <path d="M7.5 1 14 4.75v7.5L7.5 16 1 12.25v-7.5L7.5 1Z" stroke="currentColor" stroke-width="1.2"/>
          <path d="M7.5 5.5 11 7.5v4l-3.5 2L4 11.5v-4l3.5-2Z" fill="currentColor" opacity=".55"/>
        </svg>
        <span class="hud-title">AVALON</span>
        <span class="hud-season-tag">UHS CHEM</span>
      </a>

      <button id="hud-install-btn" class="hud-install-btn hidden" title="Add Avalon to Home Screen" aria-label="Add Avalon to Home Screen">
        <span class="install-pulse-dot" aria-hidden="true"></span>
        <svg class="hud-install-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span class="install-btn-label">INSTALL APP</span>
      </button>

      <nav id="hud-nav" class="hud-nav hidden">
        <button type="button" class="nav-btn" data-target="bridge">BRIDGE</button>
        <button type="button" class="nav-btn" data-target="starmap">STAR MAP</button>
        <button type="button" class="nav-btn" data-target="learn">LEARN</button>
        <button type="button" class="nav-btn" data-target="leaderboard">STANDINGS</button>
        <button type="button" class="nav-btn" data-target="inventory">INVENTORY</button>
        <button type="button" class="nav-btn" data-target="quarters">CREW</button>
      </nav>
    </div>

    <div class="hud-right">
      <div id="hud-stats" class="hud-stats hidden">
        <div class="xp-badge" id="hud-xp-badge">
          <span class="xp-val" id="hud-xp-val">0</span>
          <span class="xp-unit">XP</span>
          <div class="xp-bar-mini"><div class="xp-fill-mini" id="hud-xp-fill"></div></div>
        </div>
        <div class="level-badge" id="hud-level-badge">LVL 1</div>
        <div class="team-badge" id="hud-team-badge"></div>
      </div>

      <div class="hud-controls">
        <button id="gfx-tier-toggle" class="btn-chip" title="Toggle 3D">
          <span class="gfx-dot"></span>
          <span id="gfx-tier-label">3D ON</span>
        </button>
        <button id="fullscreen-toggle" class="btn-chip" title="Full screen">FULL</button>
        <button id="sound-toggle" class="btn-chip btn-chip-icon" title="Sound: Enabled (click to mute)" aria-label="Sound active, click to mute">
          <svg class="hud-sound-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
        </button>
        <div id="user-menu-wrap" class="relative">
          <button id="user-btn" class="btn-chip hidden">
            <span id="user-display-name">CREW</span>
          </button>
          <div id="user-dropdown" class="user-dropdown hidden">
            <a href="#/quarters" class="dropdown-item">Crew</a>
            <a href="#/settings" class="dropdown-item">Settings</a>
            <a href="#/admin" id="admin-link" class="dropdown-item hidden">Admin</a>
            <hr class="dropdown-divider">
            <button id="logout-btn" class="dropdown-item text-danger">Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Sidebar & Backdrop -->
  <div id="mobile-sidebar-backdrop" class="mobile-sidebar-backdrop" aria-hidden="true"></div>
  <aside id="mobile-sidebar" class="mobile-sidebar" aria-label="Mobile Navigation" aria-hidden="true">
    <div class="mobile-sidebar-shell">
      <div class="mobile-sidebar-header">
        <a href="#/" class="mobile-sidebar-brand" id="mobile-sidebar-brand" aria-label="Avalon home">
          <svg class="hud-logo-icon" aria-hidden="true" width="16" height="18" viewBox="0 0 15 17" fill="none">
            <path d="M7.5 1 14 4.75v7.5L7.5 16 1 12.25v-7.5L7.5 1Z" stroke="currentColor" stroke-width="1.2"/>
            <path d="M7.5 5.5 11 7.5v4l-3.5 2L4 11.5v-4l3.5-2Z" fill="currentColor" opacity=".55"/>
          </svg>
          <span class="mobile-sidebar-title">AVALON</span>
          <span class="mobile-sidebar-tag">UHS CHEM</span>
        </a>
        <button type="button" id="mobile-sidebar-close" class="mobile-sidebar-close" aria-label="Close navigation menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Player card in sidebar when logged in -->
      <div id="mobile-sidebar-profile" class="mobile-sidebar-profile hidden">
        <div class="sidebar-profile-main">
          <div class="sidebar-avatar-ring">
            <span id="mobile-sidebar-avatar-glyph">C</span>
          </div>
          <div class="sidebar-profile-text">
            <div class="sidebar-profile-name" id="mobile-sidebar-name">CREW</div>
            <div class="sidebar-profile-badges">
              <span class="sidebar-level-badge" id="mobile-sidebar-level">LVL 1</span>
              <span class="sidebar-team-badge" id="mobile-sidebar-team">EARTH</span>
            </div>
          </div>
        </div>
        <div class="sidebar-xp-track">
          <div class="sidebar-xp-labels">
            <span class="sidebar-xp-title">XP PROGRESS</span>
            <span class="sidebar-xp-value" id="mobile-sidebar-xp">0 XP</span>
          </div>
          <div class="sidebar-xp-bar"><div class="sidebar-xp-fill" id="mobile-sidebar-xp-fill"></div></div>
        </div>
      </div>

      <!-- Main Navigation Menu (The Navbar) -->
      <nav class="mobile-sidebar-nav" aria-label="Mobile Navigation Links">
        <button type="button" class="nav-btn mobile-nav-item" data-target="bridge">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="12 3 14 10 21 12 14 14 12 21 10 14 3 12 10 10 12 3" fill="currentColor" opacity="0.3"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">BRIDGE</span>
            <span class="mobile-nav-desc">Command deck & ship status</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="nav-btn mobile-nav-item" data-target="starmap">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor" opacity="0.3"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">STAR MAP</span>
            <span class="mobile-nav-desc">Sectors, worlds & quest stations</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="nav-btn mobile-nav-item" data-target="learn">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">LEARN</span>
            <span class="mobile-nav-desc">Interactive curriculum & benches</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="nav-btn mobile-nav-item" data-target="leaderboard">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 20V10"/>
            <path d="M12 20V4"/>
            <path d="M6 20v-6"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">STANDINGS</span>
            <span class="mobile-nav-desc">Guild standings & comms transmissions</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="nav-btn mobile-nav-item" data-target="inventory">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">INVENTORY</span>
            <span class="mobile-nav-desc">Cargo hold & unlocked trinkets</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>

        <button type="button" class="nav-btn mobile-nav-item" data-target="quarters">
          <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="mobile-nav-text">
            <span class="mobile-nav-title">CREW</span>
            <span class="mobile-nav-desc">Personal quarters & callsign settings</span>
          </span>
          <span class="mobile-nav-chevron" aria-hidden="true">›</span>
        </button>
      </nav>

      <!-- Sidebar Footer -->
      <div class="mobile-sidebar-footer">
        <div class="sidebar-secondary-links">
          <a href="#/settings" class="sidebar-link-btn" id="mobile-sidebar-settings-link">SETTINGS</a>
          <a href="#/admin" class="sidebar-link-btn hidden" id="mobile-sidebar-admin-link">ADMIN</a>
        </div>
        <div class="sidebar-auth-strip">
          <button type="button" id="mobile-sidebar-logout-btn" class="btn-chip text-danger hidden">SIGN OUT</button>
          <a href="#/login" id="mobile-sidebar-login-btn" class="btn-chip">SIGN IN</a>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main View Container -->
  <main id="app" class="app-viewport"></main>

  <!-- Notification Toasts -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Modal / Overlay Container -->
  <div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true" aria-label="Dialog"></div>

  <!-- Orientation Guard for Mobile Screens -->
  <div id="orientation-guard" class="orientation-guard" aria-live="assertive" role="region" aria-label="Orientation Advisory">
    <div class="glass-panel orientation-card">
      <div class="orientation-anim-wrap" aria-hidden="true">
        <div class="phone-rotate-glyph">
          <svg class="phone-svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5"></line>
          </svg>
        </div>
        <div class="rotate-arrow-glyph">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </div>
      </div>
      <div class="orientation-content">
        <h2 class="orientation-title" style="margin: 0;">Rotate your device for the best experience</h2>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
