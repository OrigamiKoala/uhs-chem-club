<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a1835"/>
      <stop offset="60%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#ffb300" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Structural Ribs -->
  <polygon points="100,1080 300,0 350,0 200,1080" fill="#080e1c"/>
  <polygon points="1820,1080 1620,0 1570,0 1720,1080" fill="#080e1c"/>
  <!-- Light Beam -->
  <rect x="200" y="520" width="1520" height="4" fill="url(#beam)"/>
  <!-- Center Hologram / Viewport Ring -->
  <circle cx="960" cy="500" r="280" fill="none" stroke="#ffb300" stroke-width="2" stroke-dasharray="12 6" opacity="0.4"/>
  <circle cx="960" cy="500" r="140" fill="#ffb300" opacity="0.08"/>
  <text x="960" y="515" fill="#ffb300" font-family="monospace" font-size="28" font-weight="bold" letter-spacing="8" text-anchor="middle">
    AVALON // CARGO
  </text>
</svg>